                // Mendengarkan perubahan data secara realtime
                galeriRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        // Mengubah object dari Firebase menjadi array
                        const fotoArray = Object.keys(data).map(key => ({
                            id: key,
                            url: data[key].url
                        }));
                        setGaleriFoto(fotoArray);
                    } else {
                        setGaleriFoto([]);
                    }
                });

                // Bersihkan pendengar saat komponen ditutup
                return () => galeriRef.off();
            }, []);
            
            // Data 5 Calon Kades
            const [quickCountData, setQuickCountData] = useState([
                { id: 1, nama: "Calon No. Urut 1", suara: 0, warna: "#4A0E18" },
                { id: 2, nama: "Calon No. Urut 2", suara: 0, warna: "#6B1725" },
                { id: 3, nama: "Calon No. Urut 3", suara: 0, warna: "#C9A227" },
                { id: 4, nama: "Calon No. Urut 4", suara: 0, warna: "#8C7B5D" },
                { id: 5, nama: "Calon No. Urut 5", suara: 0, warna: "#241C1D" },
            ]);

            useEffect(() => {
                const handleScroll = () => setIsScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const navigate = (newView) => {
                setView(newView);
                setIsMobileMenuOpen(false);
                window.scrollTo(0, 0);
            };

            const menuItems = [
                { id: 'beranda', label: 'BERANDA' },
                { id: 'informasi', label: 'INFORMASI & HASIL' },
            ];

            return (
                <div className="font-sans flex flex-col min-h-screen text-[#241C1D] bg-[#F8F7F3]">
                    
                    {/* Logika Sistem Admin */}
                    {isAdminMode && (
                        !isLoggedIn ? 
                        <AdminLogin onLogin={() => setIsLoggedIn(true)} onCancel={() => setAdminMode(false)} /> :
                        <AdminDashboard 
                            setAdminMode={setAdminMode} dptLink={dptLink} setDptLink={setDptLink} 
                            quickCountData={quickCountData} setQuickCountData={setQuickCountData} 
                            galeriFoto={galeriFoto} 
                        />
                    )}

                    {/* Navigasi / Header Utama */}
                    <header className={`fixed w-full top-0 z-50 transition-all duration-300 ${isScrolled ? 'bg-[#4A0E18] shadow-lg py-3' : 'bg-[#4A0E18] py-5 border-b border-white/10'}`}>
                        <div className="container mx-auto px-4 md:px-6 flex justify-between items-center">
                            <div className="flex items-center gap-4 cursor-pointer group" onClick={() => navigate('beranda')}>
                                <div className="w-10 h-10 md:w-12 md:h-12 bg-[#C9A227] rounded-full flex items-center justify-center border-2 border-white/20 shrink-0 shadow-inner group-hover:scale-105 transition-transform overflow-hidden">
                                    <img src="logopptd (1).png" alt="Logo Air Nyatoh" className="w-full h-full object-cover" />
                                </div>
                                <div className="flex flex-col text-white">
                                    <span className="text-[10px] md:text-xs font-bold tracking-widest text-[#C9A227]">PANITIA PEMILIHAN</span>
                                    <span className="text-sm md:text-base font-bold font-serif leading-tight">DESA AIR NYATOH</span>
                                </div>
                            </div>
                            
                            <nav className="hidden md:flex gap-8 items-center">
                                {menuItems.map(item => (
                                    <button 
                                        key={item.id} onClick={() => navigate(item.id)}
                                        className={`text-sm font-bold tracking-wide transition-colors relative group py-2 ${view === item.id ? 'text-[#C9A227]' : 'text-white hover:text-[#C9A227]'}`}
                                    >
                                        {item.label}
                                        {view === item.id && <span className="absolute bottom-0 left-0 w-full h-0.5 bg-[#C9A227] rounded-full"></span>}
                                    </button>
                                ))}
                            </nav>

                            <button className="md:hidden text-white p-2" onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}>
                                <i className={`fa-solid ${isMobileMenuOpen ? 'fa-xmark' : 'fa-bars'} text-2xl`}></i>
                            </button>
                        </div>
                        
                        {/* Mobile Menu Dropdown */}
                        {isMobileMenuOpen && (
                            <div className="md:hidden absolute top-full left-0 w-full bg-[#4A0E18] border-t border-white/10 shadow-xl py-2 flex flex-col animate-slide-up">
                                {menuItems.map(item => (
                                    <button 
                                        key={item.id} onClick={() => navigate(item.id)}
                                        className={`py-4 px-6 text-left text-sm font-bold tracking-wide border-b border-white/5 ${view === item.id ? 'text-[#C9A227] bg-black/10' : 'text-white'}`}
                                    >
                                        {item.label}
                                    </button>
                                ))}
                            </div>
                        )}
                    </header>

                    {/* Body Routing */}
                    <main className="flex-grow">
                        {view === 'beranda' && <Beranda dptLink={dptLink} setView={navigate} galeriFoto={galeriFoto} />}
                        {view === 'informasi' && <Informasi dptLink={dptLink} quickCountData={quickCountData} />}
                    </main>

                    {/* Footer Utama */}
                    <footer className="bg-[#4A0E18] text-[#F8F7F3] border-t-4 border-[#C9A227] pt-16 pb-8 relative overflow-hidden mt-auto">
                        <div className="container mx-auto px-6 relative z-10">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-10 mb-12">
                                <div>
                                    <div className="flex items-center gap-4 mb-6">
                                        <div className="w-12 h-12 bg-[#C9A227] rounded-full flex items-center justify-center">
                                            <i className="fa-solid fa-shield-halved text-[#4A0E18] text-xl"></i>
                                        </div>
                                        <div>
                                            <h3 className="font-serif font-bold text-lg leading-tight">PANITIA PEMILIHAN<br/>DESA AIR NYATOH</h3>
                                        </div>
                                    </div>
                                    <p className="text-sm text-white/70 leading-relaxed mb-6 max-w-sm">
                                        Penyelenggara independen Pemilihan Kepala Desa Air Nyatoh Tahun 2026. Berkomitmen mewujudkan pemilihan yang transparan, jujur, dan berintegritas.
                                    </p>
                                    
                                    {/* Tombol Rahasia Untuk Membuka Admin */}
                                    <button onClick={() => setAdminMode(true)} className="text-xs text-[#C9A227] hover:text-white flex items-center gap-1.5 transition-colors font-bold uppercase tracking-wider py-2 px-4 rounded-lg bg-black/20 border border-white/10 cursor-pointer">
                                        <i className="fa-solid fa-lock"></i> Login Dashboard Admin
                                    </button>
                                </div>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
