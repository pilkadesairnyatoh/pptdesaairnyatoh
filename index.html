    <!-- Appwrite SDK (Pengganti Firebase) -->

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #F8F7F3;
            color: #241C1D;
        }
        h1, h2, h3, h4, h5, h6, .font-serif {

        }

        .sembunyikan-gulir { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes masukMemudar { from { opacity: 0; } to { opacity: 1; } }
        @keyframes geserNaik { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animasi-memudar { animation: masukMemudar 0.5s ease-in-out; }
        .animasi-naik { animation: geserNaik 0.6s ease-out; }
    </style>
</head>
<body>
    <div id="akar"></div>

    <script type="text/babel">

        // ==========================================

        const { useState, useEffect } = React;

        const JADWAL_SINGKAT = [
            { id: 1, nama: "Persiapan & Pembentukan", mulai: "6 Jul", selesai: "4 Ags 2026", status: "selesai" },
            { id: 2, nama: "Pendaftaran Bakal Calon", mulai: "6 Ags", selesai: "19 Ags 2026", status: "selesai" },

            { id: 4, nama: "Penetapan Calon", mulai: "14 Sep", selesai: "24 Sep 2026", status: "mendatang" },
            { id: 5, nama: "Daftar Pemilih", mulai: "28 Sep", selesai: "30 Okt 2026", status: "mendatang" },

        const JADWAL_LENGKAP = [

            { id: 2, tahap: "PERSIAPAN", nama: "Pembentukan Panitia Pemilihan", mulai: "31 Jul 2026", selesai: "31 Jul 2026", status: "selesai" },
            { id: 4, tahap: "PENCALONAN", nama: "Pengumuman dan pendaftaran bakal calon", mulai: "6 Ags 2026", selesai: "19 Ags 2026", status: "selesai" },
            { id: 5, tahap: "PENCALONAN", nama: "Verifikasi dan validasi kelengkapan administrasi", mulai: "20 Ags 2026", selesai: "21 Ags 2026", status: "selesai" },
            { id: 7, tahap: "PENCALONAN", nama: "Klarifikasi persyaratan administrasi", mulai: "31 Ags 2026", selesai: "11 Sep 2026", status: "aktif" },
            { id: 8, tahap: "PENCALONAN", nama: "Penetapan bakal calon yang memenuhi persyaratan", mulai: "14 Sep 2026", selesai: "14 Sep 2026", status: "mendatang" },
            { id: 11, tahap: "PENCALONAN", nama: "Penetapan calon dan Pengundian nomor urut", mulai: "23 Sep 2026", selesai: "24 Sep 2026", status: "mendatang" },
            { id: 12, tahap: "PEMUTAKHIRAN", nama: "Penyusunan Daftar Pemilih Tetap", mulai: "28 Sep 2026", selesai: "30 Okt 2026", status: "mendatang" },
            { id: 14, tahap: "KAMPANYE", nama: "Pelaksanaan kampanye calon kepala desa", mulai: "10 Nov 2026", selesai: "12 Nov 2026", status: "mendatang" },
            { id: 16, tahap: "PEMUNGUTAN", nama: "Pemungutan, Penghitungan suara & Rekapitulasi", mulai: "18 Nov 2026", selesai: "20 Nov 2026", status: "mendatang" },
            { id: 20, tahap: "PELANTIKAN", nama: "Pengesahan dan Pelantikan", mulai: "21 Des 2026", selesai: "5 Feb 2027", status: "mendatang" }
        ];

        const JudulBagian = ({ judul, subjudul, diTengah = true }) => (
            <div className={`mb-10 ${diTengah ? 'text-center' : 'text-left'}`}>
                {subjudul && <p className="text-[#C9A227] font-semibold tracking-wider text-sm uppercase mb-2">{subjudul}</p>}
                <h2 className="text-3xl md:text-4xl font-serif font-bold text-[#4A0E18]">{judul}</h2>
                <div className={`w-16 h-1 bg-[#C9A227] mt-4 ${diTengah ? 'mx-auto' : ''} rounded-full`}></div>
            </div>
        );

        const Beranda = ({ tautanDpt, aturTampilan, galeriFoto }) => {
            const [gambarSaatIni, aturGambarSaatIni] = useState(0);

            useEffect(() => {
                if (galeriFoto && galeriFoto.length > 1) {
                    const pewaktu = setInterval(() => {
                        aturGambarSaatIni((sebelumnya) => (sebelumnya + 1) % galeriFoto.length);
                    }, 4000);
                    return () => clearInterval(pewaktu);

            }, [galeriFoto]);

            return (
                <div className="animasi-memudar">
                    <section className="relative bg-[#4A0E18] text-[#F8F7F3] overflow-hidden min-h-[85vh] flex items-center pt-20">
                        <div className="absolute inset-0 opacity-10" style={{ backgroundImage: "url(\"data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9a227' fill-opacity='1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E\")" }}></div>
                        <div className="absolute inset-0 bg-gradient-to-r from-[#4A0E18] via-[#4A0E18]/90 to-transparent"></div>
                        
                        <div className="container mx-auto px-6 relative z-10 py-20">
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
                                <div className="max-w-2xl">
                                    <div className="inline-block border border-[#C9A227]/30 rounded-full px-4 py-1.5 mb-6 backdrop-blur-sm bg-black/10">
                                        <span className="text-[#C9A227] text-sm font-medium tracking-widest uppercase">Portal Resmi Panitia Pemilihan Tingkat Desa</span>
                                    </div>
                                    <h1 className="text-4xl md:text-6xl lg:text-7xl font-serif font-bold leading-tight mb-4 drop-shadow-lg">
                                        PEMILIHAN <br className="hidden md:block"/> KEPALA DESA <br className="hidden md:block"/> <span className="text-[#C9A227]">AIR NYATOH</span>
                                    </h1>
                                    <h2 className="text-2xl md:text-3xl font-serif text-white/90 mb-6">TAHUN 2026</h2>
                                    <p className="text-lg md:text-xl text-[#F8F7F3]/80 mb-10 max-w-2xl border-l-4 border-[#C9A227] pl-4">

                                    </p>
                                    <div className="flex flex-col sm:flex-row gap-4">
                                        <button onClick={() => aturTampilan('informasi')} className="bg-[#C9A227] text-[#4A0E18] font-bold py-3 px-8 rounded-lg hover:bg-yellow-500 transition-colors shadow-[0_4px_14px_0_rgba(201,162,39,0.39)] flex items-center justify-center gap-2">
                                            LIHAT INFORMASI <i className="fa-solid fa-circle-info"></i>
                                        </button>
                                        <a href={tautanDpt} target="_blank" rel="noopener noreferrer" className="bg-transparent border-2 border-[#C9A227] text-[#C9A227] font-bold py-3 px-8 rounded-lg hover:bg-[#C9A227]/10 transition-colors flex items-center justify-center gap-2">
                                            CEK DAFTAR PEMILIH <i className="fa-solid fa-arrow-up-right-from-square"></i>
                                        </a>
                                    </div>
                                </div>

                                <div className="relative w-full h-[350px] md:h-[450px] bg-white/5 rounded-2xl overflow-hidden shadow-2xl border border-white/10 group flex items-center justify-center">
                                    {galeriFoto && galeriFoto.length > 0 ? (
                                        <>

                                                <div key={foto.id} className={`absolute inset-0 transition-opacity duration-1000 ${gambarSaatIni === indeks ? 'opacity-100' : 'opacity-0'}`}>

                                                </div>
                                            ))}
                                            {galeriFoto.length > 1 && (
                                                <div className="absolute bottom-4 left-0 right-0 flex justify-center gap-2 z-20">
                                                    {galeriFoto.map((_, indeks) => (
                                                        <button 
                                                            key={indeks} onClick={() => aturGambarSaatIni(indeks)} 
                                                            className={`w-3 h-3 rounded-full transition-all ${gambarSaatIni === indeks ? 'bg-[#C9A227] w-6' : 'bg-white/50 hover:bg-white'}`}

                                                    ))}

                                            )}

                                        <div className="text-center p-6">
                                            <i className="fa-solid fa-images text-6xl text-white/20 mb-4 block"></i>
                                            <p className="text-white/50 font-medium">Galeri Dokumentasi Kosong</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            );
        };

        const Informasi = ({ tabAwal, tautanDpt, dataHitungCepat }) => {
            const [tabAktif, aturTabAktif] = useState(tabAwal || 'jadwal');
            
            const daftarTab = [
                { id: 'jadwal', label: 'Jadwal Lengkap', ikon: "fa-calendar-days" },
                { id: 'calon', label: 'Calon Kepala Desa', ikon: "fa-users" },
                { id: 'tps', label: 'Informasi Lokasi', ikon: "fa-location-dot" },
                { id: 'hasil', label: 'Hitung Cepat', ikon: "fa-chart-column" },
            ];

            return (
                <div className="animasi-memudar bg-[#F8F7F3] min-h-screen py-24 md:py-32">
                    <div className="container mx-auto px-4 md:px-6 max-w-6xl">
                        <JudulBagian judul="Pusat Informasi" subjudul="Data Pemilihan" />

                        <div className="flex overflow-x-auto sembunyikan-gulir border-b-2 border-gray-200 mb-8 pb-px">
                            <div className="flex space-x-2 md:space-x-8 min-w-max px-2">
                                {daftarTab.map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => aturTabAktif(tab.id)}
                                        className={`py-3 px-3 md:px-1 border-b-4 font-medium text-sm transition-colors whitespace-nowrap flex items-center gap-2 ${
                                            tabAktif === tab.id 
                                                ? 'border-[#C9A227] text-[#4A0E18] font-bold' 
                                                : 'border-transparent text-gray-500 hover:text-[#4A0E18] hover:border-gray-300'
                                        }`}
                                    >
                                        <i className={`fa-solid ${tab.ikon}`}></i> {tab.label}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-100 min-h-[400px]">
                            {tabAktif === 'jadwal' && (
                                <div className="animasi-memudar">
                                    <h3 className="text-xl font-bold text-[#4A0E18] mb-6 flex items-center gap-2">
                                        <i className="fa-solid fa-calendar-days text-[#C9A227]"></i> Jadwal Tahapan
                                    </h3>
                                    <div className="overflow-x-auto rounded-xl border border-gray-200">
                                        <table className="w-full text-left border-collapse text-sm">
                                            <thead>
                                                <tr className="bg-gray-50 text-gray-700">
                                                    <th className="p-4 border-b font-bold w-1/5">Fase</th>
                                                    <th className="p-4 border-b font-bold w-2/5">Uraian Tahapan</th>
                                                    <th className="p-4 border-b font-bold">Waktu</th>
                                                    <th className="p-4 border-b font-bold text-center">Status</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {JADWAL_LENGKAP.map((item, indeks) => (
                                                    <tr key={indeks} className="hover:bg-gray-50 transition-colors">
                                                        <td className="p-4 border-b text-[#C9A227] font-bold text-xs uppercase tracking-wider">{item.tahap}</td>
                                                        <td className="p-4 border-b text-gray-800 font-medium leading-snug">{item.nama}</td>
                                                        <td className="p-4 border-b text-gray-600 whitespace-nowrap">{item.mulai}{item.selesai !== item.mulai ? ` - ${item.selesai}` : ''}</td>
                                                        <td className="p-4 border-b text-center">
                                                            <span className={`px-2.5 py-1 text-[10px] font-bold rounded-md uppercase whitespace-nowrap ${
                                                                item.status === 'selesai' ? 'bg-green-100 text-green-700' :
                                                                item.status === 'aktif' ? 'bg-[#C9A227]/20 text-[#4A0E18] border border-[#C9A227]/30' : 'bg-gray-100 text-gray-500'

                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {tabAktif === 'calon' && (
                                <div className="animasi-memudar text-center py-16">

                                    </div>

                                </div>
                            )}

                            {tabAktif === 'tps' && (
                                <div className="animasi-memudar">
                                    <h3 className="text-xl font-bold text-[#4A0E18] mb-6 flex items-center gap-3 border-b pb-4">
                                        <i className="fa-solid fa-location-dot text-[#C9A227] text-2xl"></i> Daftar Tempat Pemungutan Suara
                                    </h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {[1, 2, 3, 4].map(nomor => (
                                            <div key={nomor} className="border border-gray-200 rounded-xl p-5 hover:border-[#C9A227]/50 transition-colors flex gap-4 bg-gray-50">
                                                <div className="w-12 h-12 bg-[#4A0E18] text-[#C9A227] font-bold text-xl rounded-lg flex items-center justify-center shrink-0 shadow-inner">
                                                    {nomor < 10 ? `0${nomor}` : nomor}
                                                </div>

                                                    <h4 className="font-bold text-gray-800 mb-1">Lokasi {nomor < 10 ? `0${nomor}` : nomor}</h4>
                                                    <p className="text-sm text-gray-500">Menunggu penetapan wilayah.</p>

                            {tabAktif === 'hasil' && (

                                    <h3 className="text-xl font-bold text-[#4A0E18] mb-6 flex items-center gap-3 border-b pb-4">
                                        <i className="fa-solid fa-chart-column text-[#C9A227] text-2xl"></i> Hasil Hitung Cepat
                                    </h3>
                                    
                                    <div className="mb-8 p-5 bg-blue-50 border border-blue-200 rounded-xl text-sm text-blue-800 flex gap-4">
                                        <i className="fa-solid fa-circle-info shrink-0 mt-0.5 text-xl"></i>
                                        <p className="leading-relaxed">Data yang ditampilkan di bawah ini adalah hasil simulasi perhitungan cepat. Hasil resmi adalah yang ditetapkan pada rapat pleno rekapitulasi.</p>
                                    </div>

                                    <div className="space-y-6">
                                        {(() => {
                                            const totalSuara = dataHitungCepat.reduce((akumulasi, saatIni) => akumulasi + saatIni.suara, 0);
                                            
                                            return dataHitungCepat.map((calon) => {
                                                const persentase = totalSuara === 0 ? 0 : ((calon.suara / totalSuara) * 100).toFixed(1);
                                                return (
                                                    <div key={calon.id} className="bg-gray-50 p-5 rounded-xl border border-gray-200 shadow-sm">
                                                        <div className="flex justify-between items-center mb-3">
                                                            <span className="font-bold text-[#4A0E18] text-lg flex items-center gap-3">
                                                                <span className="w-8 h-8 rounded-full flex items-center justify-center text-white text-sm" style={{backgroundColor: calon.warna}}>{calon.id}</span>
                                                                {calon.nama}
                                                            </span>
                                                            <div className="text-right">
                                                                <span className="font-black text-2xl text-[#C9A227]">{persentase}%</span>
                                                                <span className="text-sm text-gray-500 ml-2 block sm:inline">({calon.suara.toLocaleString('id-ID')} suara)</span>
                                                            </div>
                                                        </div>
                                                        <div className="w-full bg-gray-200 rounded-full h-4 overflow-hidden">
                                                            <div 
                                                                className="h-4 rounded-full transition-all duration-1000 ease-out" 
                                                                style={{ width: `${persentase}%`, backgroundColor: calon.warna }}
                                                            ></div>
                                                        </div>
                                                    </div>
                                                )
                                            })
                                        })()}
                                    </div>
                                </div>
                            )}

        const MasukAdmin = ({ saatMasuk, saatBatal }) => {
            const [namaPengguna, aturNamaPengguna] = useState('');
            const [kataSandi, aturKataSandi] = useState('');
            const [pesanMasalah, aturPesanMasalah] = useState('');

            const prosesMasuk = (e) => {
                e.preventDefault();
                if (namaPengguna === 'admin' && kataSandi === 'admin123') {
                    aturPesanMasalah('');

                    aturPesanMasalah('Nama pengguna atau kata sandi salah!');

            return (
                <div className="min-h-screen bg-[#4A0E18] flex items-center justify-center p-6 fixed inset-0 z-[100] animasi-memudar">
                    <div className="bg-white p-10 rounded-2xl shadow-2xl w-full max-w-md relative z-10 animasi-naik">

                            <i className="fa-solid fa-shield-halved text-3xl text-[#4A0E18]"></i>
                        </div>
                        
                        <h2 className="text-2xl font-serif font-bold text-center text-[#4A0E18] mb-1">Masuk Dasbor Admin</h2>
                        
                        {pesanMasalah && (
                            <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-6 flex items-center gap-2 border border-red-200 mt-4">
                                <i className="fa-solid fa-circle-exclamation"></i> {pesanMasalah}
                            </div>
                        )}

                        <form onSubmit={prosesMasuk} className="space-y-5 mt-6">
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-2">Nama Pengguna</label>
                                <div className="relative">
                                    <input type="text" value={namaPengguna} onChange={(e) => aturNamaPengguna(e.target.value)} required className="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#C9A227] outline-none bg-gray-50" />
                                    <i className="fa-solid fa-user absolute left-4 top-4 text-gray-400"></i>
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-2">Kata Sandi</label>
                                <div className="relative">
                                    <input type="password" value={kataSandi} onChange={(e) => aturKataSandi(e.target.value)} required className="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#C9A227] outline-none bg-gray-50" />
                                    <i className="fa-solid fa-lock absolute left-4 top-4 text-gray-400"></i>
                                </div>
                            </div>
                            <button type="submit" className="w-full bg-[#4A0E18] text-white font-bold py-3.5 rounded-xl hover:bg-[#6B1725] transition-colors shadow-lg mt-4">
                                Masuk ke Sistem
                            </button>
                        </form>

                        <button onClick={saatBatal} className="w-full mt-6 text-sm text-gray-500 hover:text-[#4A0E18] transition-colors">
                            &larr; Kembali ke Situs Web
                        </button>
                    </div>
                </div>
            );
        };

        const DasborAdmin = ({ aturModeAdmin, tautanDpt, aturTautanDpt, dataHitungCepat, aturDataHitungCepat, galeriFoto }) => {
            const [menuAktif, aturMenuAktif] = useState('dasbor');
            const [tautanSementara, aturTautanSementara] = useState(tautanDpt);
            const [tersimpan, aturTersimpan] = useState(false);

            const simpanTautan = (e) => {
                e.preventDefault();
                aturTautanDpt(tautanSementara);
                aturTersimpan(true);
                setTimeout(() => aturTersimpan(false), 3000);
            };

            const perbaruiHitungCepat = (indeks, nilai) => {
                const angka = parseInt(nilai) || 0;
                const dataBaru = [...dataHitungCepat];
                dataBaru[indeks].suara = angka;
                aturDataHitungCepat(dataBaru);
            };

            const prosesUnggahFoto = async (e) => {
                const berkas = e.target.files[0];
                if (berkas) {
                    if (berkas.size > 5 * 1024 * 1024) {
                        alert("Ukuran foto terlalu besar! Maksimal 5 MB.");
                        return;
                    }

                    e.target.disabled = true;
                    const teksLabelAsli = e.target.previousElementSibling.innerText;
                    e.target.previousElementSibling.innerText = "Mengunggah... Mohon tunggu";

                    try {
                        // 1. Simpan fisik foto ke Wadah Appwrite
                        const hasilUnggah = await penyimpanan.createFile(
                            KONFIGURASI_APPWRITE.idWadah,
                            ID.unique(),
                            berkas
                        );
                        
                        // 2. Dapatkan tautan foto
                        const tautanUnduhan = penyimpanan.getFileView(KONFIGURASI_APPWRITE.idWadah, hasilUnggah.$id).href;

                        // 3. Simpan tautan ke Koleksi Basis Data
                        await basisData.createDocument(
                            KONFIGURASI_APPWRITE.idBasisData,
                            KONFIGURASI_APPWRITE.idKoleksi,
                            ID.unique(),
                            {
                                url: tautanUnduhan,
                                idFotoPenyimpanan: hasilUnggah.$id
                            }
                        );

                        alert("Foto berhasil diunggah!");
                    } catch (kesalahan) {
                        console.error("Gagal mengunggah:", kesalahan);
                        alert("Gagal mengunggah foto. Pastikan konfigurasi Appwrite sudah benar.");
                    } finally {
                        e.target.value = '';
                        e.target.disabled = false;
                        e.target.previousElementSibling.innerText = teksLabelAsli;
                    }
                }
            };

            const hapusFoto = async (idDokumen, idFotoPenyimpanan) => {
                if(window.confirm("Yakin ingin menghapus foto ini?")) {
                    try {
                        await basisData.deleteDocument(KONFIGURASI_APPWRITE.idBasisData, KONFIGURASI_APPWRITE.idKoleksi, idDokumen);
                        if (idFotoPenyimpanan) {
                            await penyimpanan.deleteFile(KONFIGURASI_APPWRITE.idWadah, idFotoPenyimpanan);
                        }
                    } catch (kesalahan) {
                        console.error("Gagal menghapus:", kesalahan);
                    }
                }
            };

            return (
                <div className="min-h-screen bg-gray-100 flex animasi-memudar fixed inset-0 z-[100]">
                    <aside className="w-64 bg-[#4A0E18] text-white flex flex-col h-full shadow-2xl shrink-0">
                        <div className="p-6 border-b border-white/10 flex items-center gap-3">
                            <div className="w-10 h-10 bg-[#C9A227] rounded-lg flex items-center justify-center text-[#4A0E18] font-bold shadow-inner">
                                <i className="fa-solid fa-shield-halved"></i>
                            </div>
                            <div>
                                <h2 className="font-bold text-sm tracking-widest">PANITIA DESA</h2>
                                <p className="text-xs text-[#C9A227]">Panel Admin</p>
                            </div>
                        </div>
                        <nav className="flex-1 py-6 space-y-2 px-4">
                            {[
                                { id: 'dasbor', label: 'Dasbor Utama', ikon: "fa-chart-pie" },
                                { id: 'galeri', label: 'Galeri Dokumentasi', ikon: "fa-images" },
                                { id: 'hitungcepat', label: 'Hitung Cepat', ikon: "fa-chart-column" },
                                { id: 'pengaturan', label: 'Pengaturan Tautan', ikon: "fa-gear" },
                            ].map(menu => (
                                <button 
                                    key={menu.id}
                                    onClick={() => aturMenuAktif(menu.id)}
                                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all ${menuAktif === menu.id ? 'bg-[#C9A227] text-[#4A0E18] shadow-md' : 'text-gray-300 hover:bg-white/10 hover:text-white'}`}
                                >
                                    <i className={`fa-solid ${menu.ikon} w-5`}></i> {menu.label}
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-white/10">
                            <button onClick={() => aturModeAdmin(false)} className="w-full flex items-center gap-3 px-4 py-3 text-sm text-red-300 hover:text-white hover:bg-red-900/50 rounded-xl transition-colors font-medium">
                                <i className="fa-solid fa-right-from-bracket w-5"></i> Keluar Dasbor
                            </button>
                        </div>
                    </aside>

                    <main className="flex-1 p-8 overflow-y-auto">
                        <div className="max-w-5xl mx-auto">
                            <header className="mb-8 flex justify-between items-end bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                                <div>
                                    <h1 className="text-2xl font-bold text-gray-800 capitalize mb-1">{menuAktif.replace('-', ' ')}</h1>
                                    <p className="text-gray-500 text-sm">Sistem Manajemen Portal Informasi</p>
                                </div>
                            </header>

                            {menuAktif === 'dasbor' && (
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    {[
                                        { label: 'Total Calon', val: '5', warna: 'text-blue-600', latar: 'bg-blue-50', batas: 'border-blue-100' },
                                        { label: 'Foto Galeri', val: galeriFoto.length, warna: 'text-[#4A0E18]', latar: 'bg-red-50', batas: 'border-red-100' },
                                        { label: 'Pengunjung', val: '1.2K', warna: 'text-green-600', latar: 'bg-green-50', batas: 'border-green-100' },
                                    ].map((statistik, i) => (
                                        <div key={i} className={`p-6 rounded-2xl shadow-sm border ${statistik.latar} ${statistik.batas}`}>
                                            <p className="text-gray-600 text-sm mb-2 font-medium">{statistik.label}</p>
                                            <p className={`text-4xl font-black ${statistik.warna}`}>{statistik.val}</p>
                                        </div>
                                    ))}
                                </div>
                            )}

                            {menuAktif === 'galeri' && (
                                <div className="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 animasi-memudar">
                                    <h3 className="text-lg font-bold text-gray-800 mb-2">Kelola Galeri</h3>
                                    
                                    <div className="mb-8 p-6 bg-gray-50 rounded-xl border border-dashed border-gray-300">
                                        <label className="block text-sm font-bold text-gray-700 mb-4 text-center">Pilih Foto Untuk Diunggah</label>
                                        <input 
                                            type="file" accept="image/*" onChange={prosesUnggahFoto} 
                                            className="block w-full max-w-sm mx-auto text-sm text-gray-500 file:mr-4 file:py-3 file:px-6 file:rounded-xl file:border-0 file:text-sm file:font-bold file:bg-[#4A0E18] file:text-white hover:file:bg-[#6B1725] cursor-pointer" 
                                        />
                                    </div>

                                    <h4 className="font-bold text-gray-800 mb-4">Foto Tersimpan ({galeriFoto.length})</h4>
                                    {galeriFoto.length > 0 ? (
                                        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                                            {galeriFoto.map((foto) => (
                                                <div key={foto.id} className="relative group rounded-xl overflow-hidden border border-gray-200 shadow-sm aspect-video bg-gray-100">
                                                    <img src={foto.url} alt={`Galeri`} className="w-full h-full object-cover" />
                                                    <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                                        <button onClick={() => hapusFoto(foto.id, foto.idFotoPenyimpanan)} className="bg-red-500 text-white px-4 py-2 rounded-lg font-bold text-sm hover:bg-red-600 shadow-lg flex items-center gap-2 transform translate-y-4 group-hover:translate-y-0 transition-all">
                                                            <i className="fa-solid fa-trash"></i> Hapus
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    ) : (
                                        <div className="text-center py-12 bg-gray-50 rounded-xl border border-gray-200">
                                            <p className="text-gray-500">Belum ada foto yang diunggah.</p>
                                        </div>
                                    )}
                                </div>
                            )}

                            {menuAktif === 'hitungcepat' && (
                                <div className="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 animasi-memudar">
                                    <h3 className="text-lg font-bold text-gray-800 mb-8">Input Hitung Cepat</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                        {dataHitungCepat.map((calon, indeks) => (
                                            <div key={calon.id} className="bg-gray-50 rounded-xl p-5 border border-gray-200 flex flex-col justify-between">
                                                <div className="flex items-center gap-3 mb-4">
                                                    <div className="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold" style={{ backgroundColor: calon.warna }}>
                                                        {calon.id}
                                                    </div>
                                                    <h4 className="font-bold text-gray-800">{calon.nama}</h4>
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold text-gray-500 mb-2 uppercase tracking-wider">Perolehan Suara</label>
                                                    <input 
                                                        type="number" min="0" value={calon.suara}
                                                        onChange={(e) => perbaruiHitungCepat(indeks, e.target.value)}
                                                        className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-[#C9A227] outline-none font-bold text-xl bg-white"
                                                    />
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {menuAktif === 'pengaturan' && (
                                <div className="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 max-w-2xl animasi-memudar">
                                    <h3 className="text-lg font-bold text-gray-800 mb-8">Pengaturan Tautan</h3>
                                    <form onSubmit={simpanTautan} className="space-y-5">
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 mb-2">Tautan Situs Web Resmi</label>
                                            <input 
                                                type="url" value={tautanSementara} onChange={(e) => aturTautanSementara(e.target.value)} required
                                                className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-[#C9A227] outline-none bg-gray-50"
                                            />
                                        </div>
                                        <div className="flex items-center gap-4 pt-2">
                                            <button type="submit" className="bg-[#4A0E18] text-white px-6 py-3 rounded-xl text-sm font-bold hover:bg-[#6B1725] transition-colors">
                                                Simpan Perubahan
                                            </button>
                                            {tersimpan && <span className="text-green-600 text-sm font-bold flex items-center gap-1"><i className="fa-solid fa-check"></i> Tersimpan</span>}
                                        </div>
                                    </form>
                                </div>
                            )}
                        </div>
                    </main>
                </div>
            );
        };

        const Aplikasi = () => {
            const [tampilan, aturTampilan] = useState('beranda');
            const [sudahDigulir, aturSudahDigulir] = useState(false);
            const [menuPonselTerbuka, aturMenuPonselTerbuka] = useState(false);
            
            const [tautanDpt, aturTautanDpt] = useState('https://pptairnyatoh-spec.github.io/cekdptpilkadesairnyatoh');
            const [modeAdmin, aturModeAdmin] = useState(false);
            const [sudahMasuk, aturSudahMasuk] = useState(false);
            
            const [galeriFoto, aturGaleriFoto] = useState([]);
            
            // FUNGSI MENGAMBIL DATA DARI APPWRITE
            useEffect(() => {
                // Memastikan ID sudah diisi agar tidak memunculkan pesan kesalahan
                if (KONFIGURASI_APPWRITE.idBasisData === "MASUKKAN_ID_BASIS_DATA_DI_SINI") return;

                const ambilDataGaleri = async () => {
                    try {
                        const hasil = await basisData.listDocuments(
                            KONFIGURASI_APPWRITE.idBasisData, 
                            KONFIGURASI_APPWRITE.idKoleksi
                        );
                        const daftarFoto = hasil.documents.map(dokumen => ({
                            id: dokumen.$id,
                            url: dokumen.url,
                            idFotoPenyimpanan: dokumen.idFotoPenyimpanan
                        }));
                        aturGaleriFoto(daftarFoto);
                    } catch (kesalahan) {
                        console.error("Gagal mengambil galeri:", kesalahan);
                    }
                };

                ambilDataGaleri();

                // Berlangganan secara waktu nyata (real-time)
                const saluran = `databases.${KONFIGURASI_APPWRITE.idBasisData}.collections.${KONFIGURASI_APPWRITE.idKoleksi}.documents`;
                const berhentiBerlangganan = klien.subscribe(saluran, (tanggapan) => {
                    ambilDataGaleri();
                });

                return () => berhentiBerlangganan();
            }, []);
            
            const [dataHitungCepat, aturDataHitungCepat] = useState([
                { id: 1, nama: "Calon No. Urut 1", suara: 0, warna: "#4A0E18" },
                { id: 2, nama: "Calon No. Urut 2", suara: 0, warna: "#6B1725" },
                { id: 3, nama: "Calon No. Urut 3", suara: 0, warna: "#C9A227" },
                { id: 4, nama: "Calon No. Urut 4", suara: 0, warna: "#8C7B5D" },
                { id: 5, nama: "Calon No. Urut 5", suara: 0, warna: "#241C1D" },
            ]);

            useEffect(() => {
                const tanganiGulir = () => aturSudahDigulir(window.scrollY > 20);
                window.addEventListener('scroll', tanganiGulir);
                return () => window.removeEventListener('scroll', tanganiGulir);
            }, []);

            const navigasi = (tampilanBaru) => {
                aturTampilan(tampilanBaru);
                aturMenuPonselTerbuka(false);
                window.scrollTo(0, 0);
            };

            return (
                <div className="font-sans flex flex-col min-h-screen text-[#241C1D] bg-[#F8F7F3]">
                    
                    {modeAdmin && (
                        !sudahMasuk ? 
                        <MasukAdmin saatMasuk={() => aturSudahMasuk(true)} saatBatal={() => aturModeAdmin(false)} /> :
                        <DasborAdmin 
                            aturModeAdmin={aturModeAdmin} tautanDpt={tautanDpt} aturTautanDpt={aturTautanDpt} 
                            dataHitungCepat={dataHitungCepat} aturDataHitungCepat={aturDataHitungCepat} 
                            galeriFoto={galeriFoto} 
                        />
                    )}

                    <header className={`fixed w-full top-0 z-50 transition-all duration-300 ${sudahDigulir ? 'bg-[#4A0E18] shadow-lg py-3' : 'bg-[#4A0E18] py-5 border-b border-white/10'}`}>
                        <div className="container mx-auto px-4 md:px-6 flex justify-between items-center">
                            <div className="flex items-center gap-4 cursor-pointer group" onClick={() => navigasi('beranda')}>
                                <div className="w-10 h-10 md:w-12 md:h-12 bg-[#C9A227] rounded-full flex items-center justify-center border-2 border-white/20 shrink-0 shadow-inner group-hover:scale-105 transition-transform overflow-hidden">
                                    <span className="font-bold text-white text-xs">PILIH</span>
                                </div>
                                <div className="flex flex-col text-white">
                                    <span className="text-[10px] md:text-xs font-bold tracking-widest text-[#C9A227]">PANITIA PEMILIHAN</span>
                                    <span className="text-sm md:text-base font-bold font-serif leading-tight">DESA AIR NYATOH</span>
                                </div>
                            </div>
                            
                            <nav className="hidden md:flex gap-8 items-center">
                                {['beranda', 'informasi'].map(id => (
                                    <button 
                                        key={id} onClick={() => navigasi(id)}
                                        className={`text-sm font-bold tracking-wide transition-colors relative group py-2 uppercase ${tampilan === id ? 'text-[#C9A227]' : 'text-white hover:text-[#C9A227]'}`}
                                    >
                                        {id}
                                        {tampilan === id && <span className="absolute bottom-0 left-0 w-full h-0.5 bg-[#C9A227] rounded-full"></span>}
                                    </button>
                                ))}
                            </nav>

                            <button className="md:hidden text-white p-2" onClick={() => aturMenuPonselTerbuka(!menuPonselTerbuka)}>
                                <i className={`fa-solid ${menuPonselTerbuka ? 'fa-xmark' : 'fa-bars'} text-2xl`}></i>
                            </button>
                        </div>
                        
                        {menuPonselTerbuka && (
                            <div className="md:hidden absolute top-full left-0 w-full bg-[#4A0E18] border-t border-white/10 shadow-xl py-2 flex flex-col animasi-naik">
                                {['beranda', 'informasi'].map(id => (
                                    <button 
                                        key={id} onClick={() => navigasi(id)}
                                        className={`py-4 px-6 text-left text-sm font-bold tracking-wide border-b border-white/5 uppercase ${tampilan === id ? 'text-[#C9A227] bg-black/10' : 'text-white'}`}
                                    >
                                        {id}
                                    </button>
                                ))}
                            </div>
                        )}
                    </header>

                    <main className="flex-grow">
                        {tampilan === 'beranda' && <Beranda tautanDpt={tautanDpt} aturTampilan={navigasi} galeriFoto={galeriFoto} />}
                        {tampilan === 'informasi' && <Informasi tautanDpt={tautanDpt} dataHitungCepat={dataHitungCepat} />}
                    </main>

                    <footer className="bg-[#4A0E18] text-[#F8F7F3] border-t-4 border-[#C9A227] pt-16 pb-8 relative overflow-hidden mt-auto">
                        <div className="container mx-auto px-6 relative z-10">
                            <div className="grid grid-cols-1 gap-10 mb-12">
                                <div>
                                    <div className="flex items-center gap-4 mb-6">
                                        <div className="w-12 h-12 bg-[#C9A227] rounded-full flex items-center justify-center">
                                            <i className="fa-solid fa-shield-halved text-[#4A0E18] text-xl"></i>
                                        </div>
                                        <div>
                                            <h3 className="font-serif font-bold text-lg leading-tight">PANITIA PEMILIHAN<br/>DESA AIR NYATOH</h3>
                                        </div>
                                    </div>
                                    <p className="text-sm text-white/70 leading-relaxed mb-6 max-w-sm">
                                        Penyelenggara independen Pemilihan Kepala Desa Air Nyatoh Tahun 2026. Berkomitmen mewujudkan pemilihan yang transparan, jujur, dan berintegritas.
                                    </p>
                                    
                                    <button onClick={() => aturModeAdmin(true)} className="text-xs text-[#C9A227] hover:text-white flex items-center gap-1.5 transition-colors font-bold uppercase tracking-wider py-2 px-4 rounded-lg bg-black/20 border border-white/10 cursor-pointer">
                                        <i className="fa-solid fa-lock"></i> Masuk Dasbor Admin
                                    </button>
                                </div>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        const elemenAkar = ReactDOM.createRoot(document.getElementById('akar'));
        elemenAkar.render(<Aplikasi />);
    </script>
</body>
</html>
